  <!-- Texto ILC - branco para tema escuro -->
  <text x="112" y="58" font-family="'Arial', 'Helvetica Neue', sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">ILC</text>

